<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0812" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="MyWork Tracker — a personal app to log daily work, plan future tasks and keep your work history." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyWork" />
  <title>MyWork Tracker</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- apply the saved light/dark mode before first paint, no colour flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mwt.mode');
        var mode = saved === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-mode', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#f4f1fa' : '#0a0812');
      } catch (e) { /* storage unavailable - dark stays */ }
    })();
  </script>
</head>
<body>
  <div class="app-glow" aria-hidden="true"></div>

  <div class="app">
    <header class="app-header">
      <a class="brand" href="#/home" aria-label="MyWork Tracker home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12.5 9.5 18 20 6.5" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>MyWork</strong>
          <small>Tracker</small>
        </span>
      </a>
      <span class="date-pill" id="header-date"></span>
    </header>

    <main class="view" id="view" role="main" tabindex="-1">
      <!-- rendered by js/app.js -->
    </main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Add work or plan a task">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Quick add" hidden></section>

  <div class="lightbox" id="lightbox" data-action="close-lightbox" hidden>
    <img id="lightbox-img" alt="Work photo">
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
